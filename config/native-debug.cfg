terminal_output console
echo "GBNATIVE: GRUB configuration reached"
set timeout_style=menu
set timeout=15
set default=0
menuentry 'Googlebook native RK3588 - experimental' {
    search --no-floppy --label GBNATIVE --set=root
    echo "GBNATIVE: loading Orange Pi device tree"
    devicetree /boot/rk3588-orangepi-5-plus.dtb
    echo "GBNATIVE: loading Linux 6.18.54"
    linux /boot/Image acpi=off earlycon=efifb loglevel=7 ignore_loglevel initcall_debug panic=0 root=/dev/ram0 init=/init console=ttyS2,1500000 console=tty0 androidboot.hardware=android-desktop androidboot.hardware.platform=android-desktop androidboot.boot_devices=fe2c0000.mmc androidboot.slot_suffix=_a androidboot.force_normal_boot=1 androidboot.verifiedbootstate=orange androidboot.selinux=enforcing firmware_class.path=/vendor/firmware
    echo "GBNATIVE: loading Android initramfs"
    initrd /boot/initramfs-native.cpio.gz
    echo "GBNATIVE: handing control to Linux"
    sleep --interruptible 5
}
