name: Native Panthor Mesa for Googlebook
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-mesa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mesa:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv bison flex pkg-config glslang-tools cmake llvm-18-dev libclang-18-dev clang-18 libllvmspirvlib-18-dev libexpat1-dev libdrm-dev zlib1g-dev libzstd-dev
      - name: Create pinned Python build environment
        run: |
          python3 -m venv work/env
          work/env/bin/pip install meson==1.12.1 ninja==1.13.2 mako pyyaml packaging ply
          echo "$GITHUB_WORKSPACE/work/env/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK
        run: |
          yes | sdkmanager 'ndk;28.2.13676358' >/dev/null || test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build native ARM64 GLES and Vulkan drivers
        run: bash tools/build-mesa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orangepi5-plus-googlebook-native-mesa-${{ github.run_id }}
          path: |
            output/mesa/
            work/mesa/build/meson-logs/meson-log.txt
            work/mesa/host/meson-logs/meson-log.txt
          if-no-files-found: warn
          retention-days: 14
